
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giới thiệu - Khuất Duy Văn</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      animation: fadeInBody 1s ease-in-out;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      background-size: cover;
      z-index: -2;
      animation: galaxyMove 30s linear infinite;
    }
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('https://media.giphy.com/media/l0HlPjezGY5f3jD7W/giphy.gif');
      background-size: cover;
      opacity: 0.3;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes galaxyMove {
      0% { background-position: 0 0; }
      100% { background-position: 1000px 1000px; }
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }
    nav a {
      margin: 0 10px;
      color: #00cfff;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    nav a:hover {
      color: #ffeb3b;
      text-shadow: 0 0 5px #fff;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
      color: white;
      backdrop-filter: blur(10px);
      animation: slideUp 1.2s ease-in-out;
    }
    .profile {
      text-align: center;
      animation: fadeInProfile 2s ease-in;
    }
    .profile img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
      transition: transform 0.4s ease;
    }
    .profile img:hover {
      transform: scale(1.1);
    }
    h2 {
      margin-top: 20px;
      font-size: 28px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInProfile {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Hiệu ứng chuyển trang */
    a {
      transition: opacity 0.5s ease;
    }

    a:active {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Giới thiệu</h1>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="about.html">Giới thiệu</a>
      <a href="contact.html">Liên hệ</a>
    </nav>
  </header>

  <div class="container">
    <div class="profile">
      <img src="van-avatar.jpg" alt="Ảnh đại diện Khuất Duy Văn" />
      <h2>Khuất Duy Văn</h2>
      <p>Xin chào! Mình là học sinh lớp 12A1. Mình rất đam mê công nghệ, thích khám phá lập trình và hiện tại đang phát triển trang web cá nhân của riêng mình.</p>
      <p>Hy vọng bạn sẽ thích những gì mình chia sẻ tại đây. Cảm ơn đã ghé thăm!</p>
    </div>
  </div>
</body>
</html>
