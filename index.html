<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khuất Duy Văn - Website Cá Nhân</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      overflow-x: hidden;
    }

    section {
      position: relative;
      min-height: 100vh;
      color: white;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      animation: fadeIn 1.5s ease-in-out;
      text-align: center;
    }

    #home {
      background-image: url('Cực quang_ (1).jpg');
    }

    #about {
      background-image: url('Cực quang_ (2).jpg');
    }

    #contact {
      background-image: url('Cực quang_ (3).jpg');
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 999;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00ffff;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      margin-top: 1rem;
    }

    h1, h2, p {
      opacity: 0;
      transform: translateY(30px);
      animation: slideIn 1.2s forwards;
    }

    h1 {
      animation-delay: 0.5s;
    }

    h2 {
      animation-delay: 0.7s;
    }

    p {
      animation-delay: 0.9s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Trang chủ</a>
    <a href="#about">Giới thiệu</a>
    <a href="#contact">Liên hệ</a>
  </nav>

  <section id="home">
    <h1>Chào mừng đến với website của tôi</h1>
    <img src="van-avatar.jpg" alt="Avatar" class="avatar">
  </section>

  <section id="about">
    <h2>Giới thiệu</h2>
    <p>Tôi là Khuất Duy Văn, học sinh lớp 12A1. Tôi đam mê lập trình và đang xây dựng website cá nhân để học hỏi và chia sẻ kiến thức.</p>
  </section>

  <section id="contact">
    <h2>Liên hệ</h2>
    <p>Email: van29012007@gmail.com</p>
  </section>
</body>
</html>
